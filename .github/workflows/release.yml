# Push a tag like v0.1.0 to release:
#   - lanternfolkd and lanternfolk-tui archives for 6 OS/arch targets, plus checksums
#   - a multi-arch lanternfolkd image (ko) at ghcr.io/tolaniverse/lanternfolk
#   - desktop packages for macOS, Windows, and Linux, attached to the same release
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run ./dev ci

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/login-action@v4 # ko reads these credentials; no Docker build happens
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: go run ./dev release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write # upload assets to the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run ./dev desktop-dist
        env:
          VERSION: ${{ github.ref_name }}
      - run: gh release upload "$GITHUB_REF_NAME" dist/desktop/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
